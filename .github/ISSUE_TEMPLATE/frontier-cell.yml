name: ASTIS Frontier Cell
description: Claim or split one theorem-sized formalization advance.
title: "[Frontier Cell] "
labels: []
body:
  - type: dropdown
    id: route
    attributes:
      label: Route
      description: Choose the mathematical route. Use Shared Foundation only when two or more routes need the same lower-level result.
      options:
        - SampleWiki Route
        - Riemannian Optimization
        - Optimisation
        - Statistical Optimal Transport Route
        - Higher-Order Smoothness × Sampling
        - Discrete Sampling Route
        - Markov Chain Monte Carlo Route
        - Shared Foundation
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Exact source anchor
      description: Give theorem/definition/equation/section and a stable URL or page anchor when available.
    validations:
      required: true
  - type: textarea
    id: target
    attributes:
      label: Exact mathematical target
      description: State the theorem-sized delta without silently adding or deleting assumptions.
    validations:
      required: true
  - type: textarea
    id: reuse
    attributes:
      label: Reuse / shared-floor audit
      description: Record searches in Samplinglib, Mathlib, shared Frontier Cells, and relevant formal upstreams. Classify reuse, adapt, missing, or out_of_scope.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Known parents and consumers
      description: List known prerequisite declarations and downstream source/theorem nodes.
    validations:
      required: true
  - type: checkboxes
    id: contract
    attributes:
      label: Harness contract
      options:
        - label: I will keep the Frontier Cell status evidence-backed (claimed → proved locally → independently verified → stabilized → merged).
          required: true
        - label: If blocked, I will record the exact obstruction and split a strictly smaller child cell instead of replaying the same route.
          required: true
        - label: If the missing lemma is shared by multiple routes, I will open/use one canonical Shared Foundation cell rather than implement a route-local duplicate.
          required: true

  - type: textarea
    id: discrete-contract
    attributes:
      label: Finite-state contract (Discrete Sampling or shared discrete consumer)
      description: State support, target, operator, time_model, clock, reversibility, all feasible pinnings, regime, metric, cost, source_proof_status; discrete-time claims also require aperiodicity_or_absolute_gap. See docs/discrete-sampling-protocol.md. Not required for unrelated routes.

  - type: textarea
    id: mcmc-contract
    attributes:
      label: MCMC contract (MCMC route or shared MCMC consumer)
      description: State space, target/support, kernel or generator, time/clock, invariance class, ergodicity, start, metric, cost, objective and source proof. Approximate targets require a bias contract; discrete time requires periodicity. See docs/mcmc-library-protocol.md.
