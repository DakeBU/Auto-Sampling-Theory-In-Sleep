name: OT functor isolated workspace
on:
  push:
    branches: [work/ot-functor-20260905]
    paths: [.github/workflows/ot-functor-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and fingerprint public textbook
        run: |
          mkdir -p /tmp/ot-source
          curl --fail --location --retry 2 --max-time 120 https://chewisinho.github.io/st_flour.pdf -o /tmp/ot-source/st_flour.pdf
          cd /tmp/ot-source
          sha256sum st_flour.pdf > source-sha256.txt
          date -u +%FT%TZ > retrieved-at.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ot-source-audit
          path: /tmp/ot-source
          retention-days: 1
