name: Samplinglib site

on:
  push:
    branches: [main]
    paths:
      - "AutoSamplingTheory/**"
      - "AutoSamplingTheory.lean"
      - "Tests/**"
      - "Tests.lean"
      - "website/**"
      - "lakefile.lean"
      - "lean-toolchain"
      - "lake-manifest.json"
      - "tools/astis.py"
      - "tools/astis_site.py"
      - "tools/astis_source.py"
      - "README.md"
      - ".github/workflows/blueprint-site.yml"
  pull_request:
    paths:
      - "AutoSamplingTheory/**"
      - "AutoSamplingTheory.lean"
      - "Tests/**"
      - "Tests.lean"
      - "website/**"
      - "lakefile.lean"
      - "lean-toolchain"
      - "lake-manifest.json"
      - "tools/astis.py"
      - "tools/astis_site.py"
      - "tools/astis_source.py"
      - "README.md"
      - ".github/workflows/blueprint-site.yml"
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  ASTIS_PUBLIC_SOURCE_LINKS: "1"

concurrency:
  group: blueprint-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: website-first reader build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile website generators
        run: |
          python3 -m compileall -q tools website/scripts

      - name: Test website and source-reader contracts
        run: |
          python3 -m unittest \
            tools.tests.test_astis_site \
            tools.tests.test_astis_source \
            tools.tests.test_lean_tutor \
            tools.tests.test_undergrad_guides \
            tools.tests.test_chewi_source_first_contract \
            tools.tests.test_chewi_source_first_refinement \
            tools.tests.test_samplewiki_reader_contract
          node --check website/static/site.js
          node --check website/static/ide.js
          node --check website/static/lean-tutor.js
          node --check website/static/module-lean-tutor.js
          node --check website/static/underlying-lean-graph.js

      - name: Validate canonical Chewi source edition
        run: python3 tools/astis.py chewi-source-check

      - name: Build source-derived site
        shell: bash
        run: |
          mkdir -p .astis
          set -o pipefail
          python3 website/scripts/build_site.py 2>&1 | tee .astis/site-build.log

      - name: Upload site-build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: site-build-diagnostics-${{ github.run_id }}
          path: |
            .astis/site-build.log
            .astis/reader-contract-errors.txt
          if-no-files-found: warn

      - name: Validate inventory, links, formulas, diagrams, and assets
        run: python3 website/scripts/check_site.py

      - name: Build deployable static worker bundle
        run: |
          python3 website/scripts/build_sites_bundle.py
          node --input-type=module --check < .open-next/worker.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: deploy website
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: website
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
