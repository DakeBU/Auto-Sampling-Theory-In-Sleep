name: Discrete source snapshot
on:
  push:
    branches: [feat/discrete-sampling-library]
    paths: [.github/workflows/discrete-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked source only
        run: git archive --format=tar HEAD > /tmp/astis-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: astis-discrete-source
          path: /tmp/astis-source.tar
          retention-days: 1
