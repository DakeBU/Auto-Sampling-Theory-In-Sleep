name: Apply audited discrete library changes
on:
  push:
    branches: [feat/discrete-sampling-library-20260907]
    paths: [.github/workflows/discrete-integrate-audit.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact audited source edits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, concurrent.futures, gzip, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          shas = ['f134d67bf6e30ad2825c534235a13c3002e455aa','cc1f260d8e5ec46d2ac3158eb01dc809758e36f8','48e911c211bde66b56a3d6ffe5e29e401a806479','66ed90111acb6982caf9d1d1ab8349571c8fca08','f14b78adf2645d7f65789e4178824da21e42987c','20daf2b67034b859ba3fce5bc2e0ed93b3df4eb7','07e24cd7e7f93c009ef728890f7ff1bd8124aadf','9080c395ccfab42455122f1ed4a117b999600683','7db7b0a39ccca669f621a8ea8102fae48d9ef070','7f6d0ca0ba69c0117e4991638faa07c31fdee3d7','18d286a447d7fbc1602e27a95f08567804c31167','35d9699256297506c81ccb54ef7f86a675eb6f8d','2f736de6093116228a1baeaf25acfbe037818604','a590662304135c65bb70d8012101b93f419da519','0c3d8ef087ca0aa4d1d4a842fdc3529d02d46a6d','c428b59f7bee3629e465d41521165f5a5ef67275','6165785dc49c636a761a79e19b299ff2b06374b2','164ee67aefd528742becb6af35ef1d576ac7fa42','871dcb3e52f46aac653240652ec6cc1155f7c8f4','70699d66465917caf783dbd44343d6ec6c21415b','afd6550a692176d1e9a865a6b2d018127544203f','095361d547232c7cb12e1d2ba74b7012a12f320f','d253610790c94bd52144ddee78375c1456c4e79e','2a819b1f5be52e6689edcc11b824e0542df203ca']
          def blob(sha):
              req = urllib.request.Request('https://api.github.com/repos/DakeBU/Auto-Sampling-Theory-In-Sleep/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  data = json.load(response)
              raw = base64.b64decode(data['content'])
              assert hashlib.sha1(('blob ' + str(len(raw)) + '\0').encode() + raw).hexdigest() == sha
              return raw
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              encoded = b''.join(pool.map(blob, shas))
          payload = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(payload).hexdigest() == '4d04a57c143aa8442fcdbc864ecd1fd475b0b943a895400a0fbf7dfcf62c9c02'
          changes = json.loads(payload)
          assert len(changes) == 29
          paths = []
          for change in changes:
              path = Path(change['path'])
              assert not path.is_absolute() and '..' not in path.parts
              assert not str(path).startswith('.github/')
              original = path.read_bytes() if path.exists() else b''
              assert hashlib.sha256(original).hexdigest() == change['base'], str(path)
              lines = original.decode('utf-8').splitlines(keepends=True)
              for start, end, text in reversed(change['splices']):
                  assert 0 <= start <= end <= len(lines)
                  lines[start:end] = [text]
              updated = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(updated).hexdigest() == change['result'], str(path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(updated)
              paths.append(str(path))
          subprocess.run(['git', 'add', '--'] + paths, check=True)
          print('Applied 29 source files with exact base and result fingerprints.')
          PY
      - name: Validate integrated source contracts
        run: |
          python3 -m compileall -q tools website/scripts
          python3 -m unittest tools.tests.test_discrete_sampling tools.tests.test_cross_domain_program tools.tests.test_astis_advance -q
          python3 tools/astis_frontier_cells.py check
          node --check website/static/underlying-lean-graph.js
      - name: Commit to integration branch only
        run: |
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add sixth Discrete Sampling library with shared graph and reviewed-mirror gates'
          git push origin HEAD:feat/discrete-sampling-library-20260907
