name: OT functor isolated workspace
on:
  push:
    branches: [work/ot-functor-20260905]
    paths: [.github/workflows/ot-functor-workspace.yml]
permissions:
  contents: write
concurrency:
  group: isolated-ot-functor-integration
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ot-functor-20260905
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and apply exact locally validated source patch
        run: |
          test "$GITHUB_REF_NAME" = work/ot-functor-20260905
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          parts = [pathlib.Path(f'.ot-patch/part-{i}.b64').read_text().strip() for i in range(4)]
          patch = lzma.decompress(base64.b64decode(''.join(parts), validate=True))
          expected = 'e558b3de7b036cbe385e704b63f868f712042f5040bcac12bf7a122e6f75e0ae'
          assert hashlib.sha256(patch).hexdigest() == expected, 'Patch checksum mismatch'
          pathlib.Path('/tmp/ot-functor.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','--unidiff-zero','/tmp/ot-functor.patch'],check=True)
          subprocess.run(['git','apply','--unidiff-zero','/tmp/ot-functor.patch'],check=True)
          PY
          git diff --check
          python3 -m compileall -q tools website/scripts
          python3 -m unittest tools.tests.test_cross_domain_program tools.tests.test_underlying_lean_graph tools.tests.test_project_authors_footer
          python3 tools/astis_frontier_cells.py check
          node --check website/static/underlying-lean-graph.js
          node --check website/static/graph-alias.js
      - name: Commit source only to the isolated branch
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, shutil, subprocess
          paths = subprocess.check_output(['git','ls-files','--modified','--others','--exclude-standard'],text=True).splitlines()
          paths = sorted(set(p for p in paths if not p.startswith('.ot-patch/')))
          assert all(not p.endswith('.lean') and not p.startswith('.github/workflows/') for p in paths)
          report = {p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths}
          pathlib.Path('/tmp/source-manifest.json').write_text(json.dumps(report,indent=2)+'\n')
          shutil.rmtree('.ot-patch')
          PY
          git add --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add optimal transport, shared routes, and typed functor hypergraph'
          git push origin HEAD:refs/heads/work/ot-functor-20260905
          git rev-parse HEAD > /tmp/integration-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ot-functor-integration-manifest
          path: |
            /tmp/source-manifest.json
            /tmp/integration-sha.txt
          retention-days: 1
