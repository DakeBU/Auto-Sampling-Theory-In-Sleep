name: Temporary author metadata sync
on:
  push:
    branches: [fix/readme-authors-zonghao-20260905]
    paths: [.github/workflows/tmp-author-sync.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/readme-authors-zonghao-20260905
          fetch-depth: 0
      - name: Replace stale five-author website metadata only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/astis_site.py')
          s = p.read_text(encoding='utf-8')
          replacements = {
            'Organized by Dake Bu, Ji Cheng, Atsushi Nitanda, Hau-San Wong, and Qingfu Zhang.':
              'Organized by Dake Bu, Ji Cheng, Huanjian Zhou, Andi Han, Zonghao Chen, Sinho Chewi, Matthew S. Zhang, Hau-San Wong, Qingfu Zhang, and Atsushi Nitanda.',
            'Dake Bu · Ji Cheng · Atsushi Nitanda · Hau-San Wong · Qingfu Zhang':
              'Dake Bu · Ji Cheng · Huanjian Zhou · Andi Han · Zonghao Chen · Sinho Chewi · Matthew S. Zhang · Hau-San Wong · Qingfu Zhang · Atsushi Nitanda',
            'author       = {Dake Bu and Ji Cheng and Atsushi Nitanda and\n                  Hau-San Wong and Qingfu Zhang},':
              'author       = {Dake Bu and Ji Cheng and Huanjian Zhou and Andi Han and\n                  Zonghao Chen and Sinho Chewi and Matthew S. Zhang and\n                  Hau-San Wong and Qingfu Zhang and Atsushi Nitanda},',
            '            "Dake Bu",\n            "Ji Cheng",\n            "Atsushi Nitanda",\n            "Hau-San Wong",\n            "Qingfu Zhang",':
              '            "Dake Bu",\n            "Ji Cheng",\n            "Huanjian Zhou",\n            "Andi Han",\n            "Zonghao Chen",\n            "Sinho Chewi",\n            "Matthew S. Zhang",\n            "Hau-San Wong",\n            "Qingfu Zhang",\n            "Atsushi Nitanda",',
          }
          for old, new in replacements.items():
              count = s.count(old)
              if count < 1:
                  raise SystemExit(f'missing expected author snippet: {old[:80]!r}')
              s = s.replace(old, new)
          if 'Zonghao Chen' not in s:
              raise SystemExit('Zonghao Chen was not inserted')
          p.write_text(s, encoding='utf-8', newline='\n')
          PY
          rm .github/workflows/tmp-author-sync.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/astis_site.py .github/workflows/tmp-author-sync.yml
          git commit -m 'site: synchronize canonical organizer and citation authors'
          git push origin HEAD:refs/heads/fix/readme-authors-zonghao-20260905
