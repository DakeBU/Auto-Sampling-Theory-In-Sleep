name: Discrete textbook PDF audit
on:
  push:
    branches: [feat/discrete-sampling-library-20260907]
    paths: [.github/workflows/discrete-pdf-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch immutable arXiv editions
        run: |
          mkdir -p /tmp/discrete-sources
          curl -fL --retry 2 https://arxiv.org/pdf/2307.13826v4 -o /tmp/discrete-sources/2307.13826v4.pdf
          curl -fL --retry 2 https://arxiv.org/pdf/2510.14165v1 -o /tmp/discrete-sources/2510.14165v1.pdf
          cd /tmp/discrete-sources
          sha256sum *.pdf > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: discrete-textbook-sources
          path: /tmp/discrete-sources
          retention-days: 2
