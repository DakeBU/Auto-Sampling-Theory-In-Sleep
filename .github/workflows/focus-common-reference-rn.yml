name: ASTIS focused common-reference RN

on:
  pull_request:
    paths:
      - "AutoSamplingTheory/TechnicalLemmas/Measure/CommonReferenceRadonNikodym.lean"
      - "Tests/CommonReferenceRadonNikodym.lean"
      - ".github/workflows/focus-common-reference-rn.yml"

permissions:
  contents: read

jobs:
  focused-rn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
      - run: lake build AutoSamplingTheory.TechnicalLemmas.Measure.CommonReferenceRadonNikodym
      - run: lake build Tests.CommonReferenceRadonNikodym
