  <path class="arrow" d="M680 285 H718"/>
  <path class="arrow" d="M1010 285 H1048"/>
  <path class="arrow" d="M1194 355 V420"/>

  <rect class="band" x="32" y="421" width="1336" height="249" rx="8"/>
