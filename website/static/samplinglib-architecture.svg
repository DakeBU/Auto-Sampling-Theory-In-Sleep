  <text class="node-title" x="204" y="501" text-anchor="middle">Measure &amp; Probability</text>
  <text class="node-copy" x="204" y="529" text-anchor="middle">kernels &#183; conditional expectation</text>

  <rect class="family" x="388" y="470" width="292" height="90" rx="7"/>
  <text class="node-title" x="534" y="501" text-anchor="middle">Analysis</text>
  <text class="node-copy" x="534" y="529" text-anchor="middle">convexity &#183; functional inequalities</text>

  <rect class="family" x="718" y="470" width="292" height="90" rx="7"/>
  <text class="node-title" x="864" y="501" text-anchor="middle">Dynamics</text>
  <text class="node-copy" x="864" y="529" text-anchor="middle">stochastic processes &#183; SDE</text>

  <rect class="family" x="1048" y="470" width="292" height="90" rx="7"/>
  <text class="node-title" x="1194" y="501" text-anchor="middle">Sampling Algorithms</text>
  <text class="node-copy" x="1194" y="529" text-anchor="middle">Langevin &#183; MCMC &#183; proximal &#183; diffusion</text>

  <path class="arrow" d="M204 560 V590 H430"/>
  <path class="arrow" d="M534 560 V590"/>
  <path class="arrow" d="M864 560 V590"/>
  <path class="arrow" d="M1194 560 V590 H970"/>
