<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" role="img" aria-labelledby="title desc">
  <title id="title">ASTIS layer-panel agent stack</title>
  <desc id="desc">ASTIS upper and middle panel cadence for Sampling and SDE Lean formalization.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#334155"/>
    </marker>
    <style>
      .label { font-family: Arial, sans-serif; fill: #111827; }
      .small { font-size: 16px; }
      .tiny { font-size: 13px; fill: #475569; }
      .title { font-size: 23px; font-weight: 700; }
      .box { stroke-width: 2; rx: 10; ry: 10; }
      .upper { fill: #eef2ff; stroke: #4f46e5; }
      .middle { fill: #ecfeff; stroke: #0891b2; }
      .lower { fill: #fff7ed; stroke: #ea580c; }
      .review { fill: #f0fdf4; stroke: #16a34a; }
      .memory { fill: #f8fafc; stroke: #64748b; }
      .arrow { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 7 5; }
    </style>
  </defs>

  <rect x="20" y="20" width="1140" height="680" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="18"/>
  <text class="label title" x="52" y="60">ASTIS 6h Run Cadence</text>
  <text class="label tiny" x="52" y="84">Inner cycles stay proof-focused; final audit runs upper and middle panels.</text>

  <rect class="box memory" x="55" y="115" width="230" height="95"/>
  <text class="label small" x="75" y="145" font-weight="700">Proof Blueprint</text>
  <text class="label tiny" x="75" y="170">source lines, DAG leaves,</text>
  <text class="label tiny" x="75" y="190">blockers, technical memory</text>

  <rect class="box upper" x="350" y="95" width="220" height="72"/>
  <text class="label small" x="370" y="125" font-weight="700">11 source math</text>
  <text class="label tiny" x="370" y="148">assumptions, regularity</text>
  <rect class="box upper" x="350" y="185" width="220" height="72"/>
  <text class="label small" x="370" y="215" font-weight="700">12 proof DAG</text>
  <text class="label tiny" x="370" y="238">root theorem, active leaf</text>
  <rect class="box upper" x="350" y="275" width="220" height="72"/>
  <text class="label small" x="370" y="305" font-weight="700">13 process memory</text>
  <text class="label tiny" x="370" y="328">stale routes, reports</text>

  <rect class="box upper" x="635" y="185" width="230" height="82"/>
  <text class="label small" x="655" y="218" font-weight="700">10 upper director</text>
  <text class="label tiny" x="655" y="242">one executable decision</text>

  <rect class="box middle" x="360" y="405" width="230" height="72"/>
  <text class="label small" x="380" y="435" font-weight="700">21 source correspondence</text>
  <text class="label tiny" x="380" y="458">LaTeX lines to Lean</text>
  <rect class="box middle" x="360" y="492" width="230" height="72"/>
  <text class="label small" x="380" y="522" font-weight="700">22 technical lemma</text>
  <text class="label tiny" x="380" y="545">Mathlib/SLT/ASTIS memory</text>
  <rect class="box middle" x="360" y="579" width="230" height="72"/>
  <text class="label small" x="380" y="609" font-weight="700">23 report export</text>
  <text class="label tiny" x="380" y="632">Chinese + LaTeX status</text>

  <rect class="box middle" x="640" y="492" width="230" height="82"/>
  <text class="label small" x="660" y="525" font-weight="700">20 middle formalizer</text>
  <text class="label tiny" x="660" y="549">lower packets</text>

  <rect class="box lower" x="925" y="375" width="205" height="70"/>
  <text class="label small" x="945" y="405" font-weight="700">lower_1</text>
  <text class="label tiny" x="945" y="427">proof route</text>
  <rect class="box lower" x="925" y="465" width="205" height="70"/>
  <text class="label small" x="945" y="495" font-weight="700">lower_2</text>
  <text class="label tiny" x="945" y="517">Lean implementation</text>
  <rect class="box lower" x="925" y="555" width="205" height="70"/>
  <text class="label small" x="945" y="585" font-weight="700">lower_3</text>
  <text class="label tiny" x="945" y="607">technical lemma/API</text>

  <rect class="box review" x="925" y="190" width="205" height="70"/>
  <text class="label small" x="945" y="220" font-weight="700">reviewer_gate</text>
  <text class="label tiny" x="945" y="242">Lean/source gate</text>
  <rect class="box review" x="925" y="280" width="205" height="70"/>
  <text class="label small" x="945" y="310" font-weight="700">reviewer_waste</text>
  <text class="label tiny" x="945" y="332">final audit only</text>

  <path class="arrow" d="M285 160 H350"/>
  <path class="arrow" d="M285 160 C310 160,310 220,350 220"/>
  <path class="arrow" d="M285 160 C310 160,310 310,350 310"/>
  <path class="arrow" d="M570 130 C610 130,610 205,635 220"/>
  <path class="arrow" d="M570 220 H635"/>
  <path class="arrow" d="M570 310 C610 310,610 250,635 230"/>
  <path class="arrow" d="M750 267 V395 H475 V405"/>
  <path class="arrow" d="M750 267 V395 H475 V492"/>
  <path class="arrow" d="M750 267 V395 H475 V579"/>
  <path class="arrow" d="M590 441 C625 441,625 520,640 520"/>
  <path class="arrow" d="M590 528 H640"/>
  <path class="arrow" d="M590 615 C625 615,625 545,640 545"/>
  <path class="arrow" d="M870 532 H925"/>
  <path class="arrow" d="M870 532 C895 532,895 410,925 410"/>
  <path class="arrow" d="M870 532 C895 532,895 590,925 590"/>
  <path class="arrow" d="M1027 375 V350"/>
  <path class="arrow" d="M1027 465 V350"/>
  <path class="arrow" d="M1027 555 V350"/>
  <path class="arrow" d="M925 225 H805 V210 H865"/>
  <path class="arrow dash" d="M925 315 H810 V660 H285 V185"/>

  <text class="label tiny" x="55" y="675">Default: inner panel off, final panel on. Enable inner panels only for source drift, stale DAG, memory drift, or report confusion.</text>
</svg>
