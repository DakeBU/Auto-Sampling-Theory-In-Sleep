name: Apply accumulated-energy integration once

on:
  push:
    branches:
      - chapter-1-langevin-diffusion-completion
    paths:
      - tools/apply_accumulated_energy_registration.py
      - .github/workflows/apply-accumulated-energy-registration-once.yml

permissions:
  contents: write

concurrency:
  group: apply-accumulated-energy-registration-once
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'DakeBU/Auto-Sampling-Theory-In-Sleep' &&
      github.ref_name == 'chapter-1-langevin-diffusion-completion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chapter-1-langevin-diffusion-completion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch imports, Registry, and count evidence
        run: python3 tools/apply_accumulated_energy_registration.py
      - name: Commit deterministic integration and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Dake Bu"
          git config user.email "159223240+DakeBU@users.noreply.github.com"
          git rm tools/apply_accumulated_energy_registration.py
          git rm .github/workflows/apply-accumulated-energy-registration-once.yml
          git add AutoSamplingTheory/TechnicalLemmas/StochasticProcesses.lean Tests.lean AutoSamplingTheory/TechnicalLemmas/Registry.lean Tests/Basic.lean
          git diff --cached --check
          git commit -m "Register accumulated-energy localization leaves"
          git push origin HEAD:chapter-1-langevin-diffusion-completion
