name: Samplinglib site

on:
  push:
    branches: [main]
    paths:
      - "AutoSamplingTheory/**"
      - "AutoSamplingTheory.lean"
      - "Tests/**"
      - "Tests.lean"
      - "website/**"
      - "lakefile.lean"
      - "lean-toolchain"
      - "lake-manifest.json"
      - "tools/astis.py"
      - "tools/astis_harness.py"
      - "tools/astis_formalizer.py"
      - "tools/astis_site.py"
      - "tools/astis_source.py"
      - "README.md"
      - ".github/workflows/blueprint-site.yml"
  pull_request:
    paths:
      - "AutoSamplingTheory/**"
      - "AutoSamplingTheory.lean"
      - "Tests/**"
      - "Tests.lean"
      - "website/**"
      - "lakefile.lean"
      - "lean-toolchain"
      - "lake-manifest.json"
      - "tools/astis.py"
      - "tools/astis_harness.py"
      - "tools/astis_formalizer.py"
      - "tools/astis_site.py"
      - "tools/astis_source.py"
      - "README.md"
      - ".github/workflows/blueprint-site.yml"
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  ASTIS_PUBLIC_SOURCE_LINKS: "1"

concurrency:
  group: blueprint-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chapter-1-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Lean and Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true

      - name: Compile generator and preview tools
        run: |
          python3 -m py_compile \
            tools/astis_site.py \
            tools/astis_source.py \
            tools/astis_harness.py \
            tools/astis_formalizer.py \
            website/scripts/build_site.py \
            website/scripts/check_site.py \
            website/scripts/implicit_prerequisites.py \
            website/scripts/information_architecture.py \
            website/scripts/lean_tutor.py \
            website/scripts/samplewiki_examples.py \
            website/scripts/source_foundations.py \
            website/scripts/theorem_lessons.py \
            website/scripts/undergrad_guides.py \
            website/scripts/build_sites_bundle.py \
            website/scripts/lean_gate.py \
            website/scripts/ide_server.py \
            website/scripts/serve_preview.py \
            website/scripts/quick_tunnel.py

      - name: Test formalization and harness contracts
        run: |
          python3 -m unittest \
            tools.tests.test_astis_formalizer \
            tools.tests.test_astis_site \
            tools.tests.test_astis_source \
            tools.tests.test_astis_ide_server \
            tools.tests.test_lean_tutor \
            tools.tests.test_undergrad_guides
          python3 tools/astis.py harness-test
          node --check website/static/site.js
          node --check website/static/ide.js
          node --check website/static/lean-tutor.js
          node --check website/static/module-lean-tutor.js

      - name: Validate canonical Chewi source edition
        run: python3 tools/astis.py chewi-source-check

      - name: Validate Chapter 1 item-level evidence
        run: python3 tools/astis.py chapter-1-check

      - name: Run Lean, Tests, and ASTIS consistency gate
        run: python3 website/scripts/lean_gate.py

      - name: Build source-derived site
        run: python3 website/scripts/build_site.py

      - name: Validate inventory, status, links, formulas, diagrams, and assets
        run: python3 website/scripts/check_site.py

      - name: Build deployable static worker bundle
        run: |
          python3 website/scripts/build_sites_bundle.py
          node --input-type=module --check < .open-next/worker.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  chapter-1-closure:
    runs-on: ubuntu-latest
    needs: chapter-1-foundation
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Chapter 1 closure report
        run: python3 website/scripts/build_site.py

      - name: Run final Chapter 1 closure gate
        id: closure
        # During ordinary incremental PRs and main checkpoints, keep the exact
        # closure debt visible without turning an otherwise verified checkpoint
        # red.  Manual closure runs and merge queues remain strict.
        continue-on-error: ${{ github.event_name != 'workflow_dispatch' && github.event_name != 'merge_group' }}
        shell: bash
        run: |
          set +e

          python3 tools/astis.py chapter-1-check --require-complete \
            2>&1 | tee _site/data/chapter-1-closure.log
          chapter_status=${PIPESTATUS[0]}

          python3 website/scripts/check_site.py --require-chapter-1-closure \
            2>&1 | tee -a _site/data/chapter-1-closure.log
          site_status=${PIPESTATUS[0]}

          if (( chapter_status != 0 || site_status != 0 )); then
            exit 1
          fi

      - name: Upload Chapter 1 closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter-1-closure-${{ github.run_id }}
          path: |
            _site/data/chapter-1-completion-report.json
            _site/data/chapter-1-closure.log
          if-no-files-found: error

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs:
      - chapter-1-foundation
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
