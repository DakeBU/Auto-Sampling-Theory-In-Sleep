schema_version: 1
upstreams:
  - id: optlib
    repository: https://github.com/optsuite/optlib
    pinned_commit: 5da27c5f95aa6a8a45b8c14b968ade4c13ff18c3
    license: Apache-2.0
    role:
      - convex analysis
      - smoothness and strong convexity
      - subgradients
      - proximal operator
      - gradient and proximal-gradient methods
      - Nesterov acceleration
      - block-coordinate methods
      - ADMM
    integration: audited_theorem_mapping
  - id: cvxlean
    repository: https://github.com/verified-optimization/CvxLean
    pinned_commit: c62c2f292c6420f31a12e738ebebdfed50f6f840
    license: Apache-2.0
    role:
      - formal optimization problems
      - equivalence
      - reduction
      - relaxation
      - verified DCP transformations
    integration: reference_and_explicit_adapter
compatibility:
  astis_toolchain: pinned_by_root_lean-toolchain
  policy: Do not mark an upstream declaration reusable until its statement and toolchain adapter compile locally.
