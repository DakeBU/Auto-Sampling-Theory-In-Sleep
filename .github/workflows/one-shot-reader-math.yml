name: One-shot reader math normalization

on:
  push:
    branches: [chapter-1-ito-process-definition]
    paths:
      - ".github/workflows/one-shot-reader-math.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chapter-1-ito-process-definition
          fetch-depth: 0

      - name: Normalize reader-facing mathematical notation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')

          # 1. Section 1.1 lede: keep the prose, but mark all genuine notation
          # explicitly for MathJax instead of leaking ASCII pseudo-math.
          section_path = root / 'website/content/section_guides.json'
          sections = json.loads(section_path.read_text(encoding='utf-8'))
          sections['1.1'] = (
              "Introduces Brownian motion, stochastic integrals, Itô calculus, and the solution concept used to state Langevin dynamics as an SDE. "
              "Reading note on hidden prerequisites: Chewi often invokes standard calculation rules without numbering every supporting theorem. "
              "In this section the derivations implicitly require the usual conditions on the filtration; progressive measurability and its restriction/adaptedness consequences; "
              "measurability of stopped processes and first-hitting times of continuous adapted energy paths; Tonelli/Fubini on the probability-time product measure; "
              "nullity of singleton time endpoints so \\((0,t)\\), \\([0,t]\\), and related representatives agree in \\(L^2\\); "
              "the elementary Itô isometry \\(\\mathbb E[(\\sum_i H_i\\,\\Delta B_i)^2]=\\mathbb E[\\int H_t^2\\,dt]\\); "
              "\\(L^2\\) completion and uniqueness of representatives; Doob's \\(L^2\\) maximal inequality plus Borel–Cantelli for a continuous version; "
              "continuity and monotonicity of \\(A_t=\\int_0^{t\\wedge T}\\eta_s^2\\,ds\\); "
              "the identity between energy-threshold stopping and stopping at \\(\\tau_n=\\inf\\{t:A_t\\ge n\\}\\); "
              "finite expected energy after stopping; and consistency of stopped Itô integrals on overlapping horizons. "
              "ASTIS treats these as explicit implicit-lemma obligations rather than silently folding them into a calculation rule."
          )
          section_path.write_text(json.dumps(sections, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # 2. Beginner guides: explicit TeX delimiters in every place that was
          # visibly displaying ASCII/Lean-style notation.
          guides_path = root / 'website/content/undergrad_guides.json'
          guides = json.loads(guides_path.read_text(encoding='utf-8'))

          g = guides['1.1']
          g['story'][0]['intuition'] = "Imagine drawing a new continuous, extremely jagged curve every time the experiment runs. At a fixed time \\(t\\), \\(B_t\\) is a random variable; as \\(t\\) varies, the whole family is a stochastic process."
          g['story'][0]['tiny_example'] = "The increment \\(B_{t+h}-B_t\\) has mean \\(0\\) and variance \\(h\\). So a time interval four times as long produces twice the typical displacement, because standard deviation scales like \\(\\sqrt h\\)."
          g['story'][1]['title'] = "2. A filtration records what information is available by time \\(t\\)"
          g['story'][1]['intuition'] = "A filtration \\(\\mathcal F_t\\) is a growing collection of observable events. If \\(s\\le t\\), anything known at time \\(s\\) is still known at time \\(t\\)."
          g['story'][2]['intuition'] = "Before integrating a complicated random process \\(\\eta_t\\), freeze it on each time cell. The stochastic integral is then just a finite sum: current coefficient times the next Brownian increment."
          g['story'][2]['tiny_example'] = "On two cells, the integral looks like \\(H_0(B_{t_1}-B_{t_0})+H_1(B_{t_2}-B_{t_1})\\), where \\(H_0\\) is known at \\(t_0\\) and \\(H_1\\) is known at \\(t_1\\)."
          g['story'][3]['title'] = "4. The Itô isometry turns stochastic integration into an \\(L^2\\) geometry problem"
          g['story'][3]['intuition'] = "Independent mean-zero Brownian increments make the cross terms disappear. The expected square of the stochastic integral therefore equals the expected time integral of \\(\\eta_t^2\\)."
          g['story'][3]['tiny_example'] = "For a deterministic constant \\(c\\) on \\([0,T]\\), \\(\\mathbb E[(\\int_0^T c\\,dB_t)^2]=c^2T=\\int_0^T c^2\\,dt\\)."
          g['story'][3]['remember'] = "This identity is the bridge that lets us complete elementary integrands in \\(L^2\\) instead of defining the general Itô integral path-by-path."
          g['story'][4]['title'] = "5. \\(L^2\\) completion defines the integral for general square-integrable integrands"
          g['story'][4]['intuition'] = "Approximate \\(\\eta\\) by elementary processes \\(\\eta^n\\). If \\(\\eta^n\\) is Cauchy in the process \\(L^2\\) norm, the Itô isometry says their terminal stochastic integrals are Cauchy in \\(L^2(\\Omega)\\), so a unique limit exists."
          g['story'][4]['tiny_example'] = "This is the same completion idea used to construct \\(L^2\\) functions from simple functions: define the difficult object as the unique limit of easy objects under a norm that controls exactly what matters."
          g['story'][4]['remember'] = "At this point the integral is an \\(L^2\\) equivalence class. Getting one continuous process for all times requires another argument, such as Doob maximal control plus a pathwise limiting construction."
          g['story'][5]['intuition'] = "A path may accumulate too much total energy globally. Stop it when its accumulated energy reaches level \\(n+1\\). Before that random time, the stopped integrand has a deterministic \\(L^2\\) energy bound."
          g['story'][5]['tiny_example'] = "Think of a machine that is safe while cumulative heat stays below \\(n+1\\). The stopping time is the first moment the heat meter reaches the threshold; after that we turn the machine off."
          g['story'][5]['remember'] = "The hard point is not the slogan 'stop at high energy'. One must prove the hitting time is a stopping time, the stopped integrand stays measurable/progressive, its \\(L^2\\) energy is finite, and stochastic integrals agree on overlapping stopping horizons."
          g['story'][6]['intuition'] = "Brownian increments are of order \\(\\sqrt{dt}\\), so their squares are of order \\(dt\\) and survive in the limit. This creates the second-derivative correction absent from ordinary calculus."
          g['story'][6]['tiny_example'] = "For \\(f(x)=x^2\\), Itô's formula gives \\(d(B_t^2)=2B_t\\,dB_t+dt\\). The extra \\(dt\\) term records accumulated quadratic variation."
          g['story'][7]['intuition'] = "Once stochastic integration and Itô calculus are available, an equation \\(dX_t=b(X_t)\\,dt+\\sigma(X_t)\\,dB_t\\) can be read as an integral equation and studied for existence, uniqueness, and dynamics."
          g['vocabulary'][1] = ["filtration \\(\\mathcal F_t\\)", "The information available up to time \\(t\\). It grows with time."]
          g['vocabulary'][2][1] = "At time \\(t\\), the process value can be determined from \\(\\mathcal F_t\\); it does not use future information."
          g['vocabulary'][5][1] = "A random time \\(\\tau\\) for which deciding whether \\(\\tau\\le t\\) requires only information available by \\(t\\)."
          g['vocabulary'][7] = ["\\(L^2\\)", "Finite second-moment geometry. Norm convergence in \\(L^2\\) is the completion mechanism behind the Itô integral."]

          g = guides['1.2']
          g['story'][0][1] = "For each starting point \\(x\\) and elapsed time \\(t\\), record the probability law of where the process lands."
          g['story'][1] = ["2. Markov semigroup \\(P_t\\)", "Apply the transition law to a test function \\(f\\). The value \\(P_t f(x)\\) is the expected future value of \\(f\\) when starting from \\(x\\)."]
          g['story'][2] = ["3. Generator \\(L\\)", "Differentiate \\(P_t\\) at \\(t=0\\). The generator \\(L\\) is the infinitesimal velocity of observables and, for Langevin, becomes a differential operator."]
          g['story'][3][1] = "Ask which probability law is unchanged by \\(P_t\\), then whether time evolution is symmetric in \\(L^2\\) of that law."
          g['story'][4][1] = "Use \\(L\\) to measure how strongly a function varies. This turns probabilistic mixing into an energy estimate."
          g['story'][6][1] = "Differentiate the energy again. Curvature lower bounds on \\(\\Gamma_2\\) provide a structural route to functional inequalities."
          g['vocabulary'][0][1] = "A family \\(P_t\\) satisfying \\(P_0=I\\) and \\(P_{s+t}=P_sP_t\\)."
          g['vocabulary'][2][1] = "A distribution \\(\\pi\\) satisfying \\(\\pi P_t=\\pi\\) for every \\(t\\)."
          g['vocabulary'][3][1] = "The semigroup is self-adjoint in \\(L^2(\\pi)\\), a detailed-balance symmetry."
          g['vocabulary'][4][1] = "An energy often written \\(-\\langle f,Lg\\rangle_{\\pi}\\)."

          g = guides['1.3']
          g['promise'] = "You will start with couplings, build quadratic transport cost and \\(W_2\\), then understand optimal plans, duality, gluing, geodesics, continuity equations, and dynamic transport."
          g['story'][1][1] = "A coupling tells us how much mass moves from \\(x\\) to \\(y\\); integrate a cost such as \\(\\lVert x-y\\rVert^2\\)."
          g['story'][6][1] = "The distance \\(W_2\\) can be recovered as the least kinetic action, and optimal transport plans generate constant-speed geodesics."
          g['vocabulary'][2] = ["\\(W_2\\)", "The quadratic Wasserstein distance obtained from optimal expected squared displacement."]

          g = guides['1.4']
          g['audience'] = "A mathematics undergraduate who has seen gradients in Euclidean optimization and has just learned \\(W_2\\) geometry."
          g['before_you_start'] = ["Recall ordinary gradient flow \\(\\dot x=-\\nabla F(x)\\).", "Know the basic \\(W_2\\) geodesic picture from Section 1.3."]
          g['story'][0][1] = "The optimization variable is now a probability distribution \\(\\rho\\), and the objective is a functional such as \\(\\mathrm{KL}(\\rho\\,\\|\\,\\pi)\\)."
          g['story'][2][1] = "Use the \\(W_2\\) metric structure to convert that first variation into a velocity field."
          g['story'][3] = ["4. Fokker–Planck equals \\(\\mathrm{KL}\\) gradient flow", "The law of Langevin diffusion satisfies the same PDE generated by descending \\(\\mathrm{KL}\\) in Wasserstein geometry."]
          g['story'][4][1] = "Convexity along \\(W_2\\) geodesics plays the role of ordinary convexity along straight lines."
          g['story'][5][1] = "Gradient-flow identities convert convexity or functional inequalities into decay of \\(\\mathrm{KL}\\) and contraction in \\(W_2\\)."
          g['vocabulary'][2][1] = "Steepest descent of a functional measured in \\(W_2\\) geometry."

          g = guides['1.5']
          g['promise'] = "You will compare \\(\\mathrm{TV}\\), \\(\\mathrm{KL}\\), \\(\\chi^2\\), and \\(W_2\\), see how divergence inequalities transfer bounds, and understand why warm starts and initialization estimates matter in sampling complexity."
          g['before_you_start'][1] = "Remember the Poincaré/LSI decay routes and \\(W_2\\) contraction routes from Sections 1.2–1.4."
          g['story'][0][1] = "\\(\\mathrm{TV}\\) controls event probabilities, \\(\\mathrm{KL}\\) measures relative information, \\(\\chi^2\\) is a stronger density-ratio error, and \\(W_2\\) measures geometric displacement."
          g['story'][3][1] = "Passing distributions through the same Markov kernel cannot increase an \\(f\\)-divergence."
          g['story'][4][1] = "Donsker–Varadhan and \\(\\mathrm{KL}\\) chain rules let us decompose or optimize information-theoretic quantities."
          g['vocabulary'][1][1] = "Expected log density ratio; asymmetric and information-theoretic."
          g['vocabulary'][2] = ["\\(\\chi^2\\) divergence", "Expected squared density-ratio deviation; often stronger than \\(\\mathrm{KL}\\)."]
          g['vocabulary'][3][1] = "A common stochastic transformation cannot increase an \\(f\\)-divergence."
          g['vocabulary'][5][1] = "A variational characterization of \\(\\mathrm{KL}\\) using exponential moments of test functions."

          guides_path.write_text(json.dumps(guides, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # 3. Source cards: add a proper display formula and replace the most
          # visible ASCII exposition for the core Section 1.1 route.
          source_path = root / 'website/content/source_correspondence.json'
          rows = json.loads(source_path.read_text(encoding='utf-8'))
          formulas = {
              'chewi-1-1-theorem-1-1-8': r'I_t(\eta)=\int_0^t \eta_s\,dB_s,\qquad \mathbb E[I_t(\eta)^2]=\mathbb E\!\left[\int_0^t \eta_s^2\,ds\right]',
              'chewi-1-1-display-1-1-9': r'\mathbb E[I_t(\eta)^2]=\mathbb E\!\left[\int_0^t \eta_s^2\,ds\right]',
              'chewi-1-1-display-1-1-5': r'\mathbb E\!\left[\left(\sum_i H_i\Delta B_i\right)^2\right]=\sum_i \mathbb E[(H_i\Delta B_i)^2]',
              'chewi-1-1-display-1-1-6': r'\mathbb E\!\left[\left(\int_0^T \eta_s\,dB_s\right)^2\right]=\mathbb E\!\left[\int_0^T \eta_s^2\,ds\right]',
              'chewi-1-1-display-1-1-10': r'\int_0^T \eta_s(\omega)^2\,ds<\infty\quad\text{for a.e. }\omega',
              'chewi-proposition-1-1-13': r'\tau_n:=\inf\{t\le T:A_t=n+1\}\ \text{(fallback }T\text{)},\qquad \tau_n\uparrow T',
              'chewi-chapter1-displayed-identity-1-1-14': r'M_t^{(n)}=\int_0^t \eta_s\mathbf 1_{\{s\le\tau_n\}}\,dB_s',
              'chewi-proposition-1-1-16': r'M_t=\int_0^t \eta_s\,dB_s,\qquad M_{t\wedge\tau_n}=\int_0^t \eta_s\mathbf 1_{\{s\le\tau_n\}}\,dB_s',
          }
          exposition = {
              'chewi-1-1-theorem-1-1-8': "For a progressive square-integrable integrand \\(\\eta\\), elementary adapted stochastic integrals extend by \\(L^2\\) completion to a continuous martingale \\(I\\). At every \\(t\\in[0,T]\\), \\(I_t\\) is the completed integral of \\(\\eta\\) restricted to \\((0,t)\\), and any other continuous adapted version with these fixed-time representatives is indistinguishable from \\(I\\).",
              'chewi-1-1-display-1-1-9': "For \\(t\\in[0,T]\\), the second moment \\(\\mathbb E[I_t(\\eta)^2]\\) equals \\(\\mathbb E[\\int_0^t\\eta_s^2\\,ds]\\). ASTIS represents the right side by restricting \\(\\eta\\) to the strict interval \\((0,t)\\); changing an endpoint does not change the integral because singleton times are null.",
              'chewi-1-1-display-1-1-5': "Write \\(I_T(\\eta)=\\sum_i H_i\\Delta B_i\\). Expanding the square produces diagonal and cross terms; adaptedness and Brownian increment orthogonality make every cross term vanish in expectation.",
              'chewi-1-1-display-1-1-6': "The diagonal expansion is \\(\\sum_i\\mathbb E[H_i^2]\\,((t_{i+1}\\wedge T)-(t_i\\wedge T))\\), exactly the probability-time \\(L^2\\) energy of \\(\\eta\\) on \\([0,T]\\).",
              'chewi-1-1-display-1-1-10': "For almost every sample path \\(\\omega\\), the quadratic energy \\(\\int_0^T\\eta_s(\\omega)^2\\,ds\\) is finite. This is weaker than assuming finite expected energy.",
          }
          for row in rows:
              row_id = str(row.get('id', ''))
              if row_id in formulas:
                  row['latex_statement'] = formulas[row_id]
              if row_id in exposition:
                  row['mathematical_exposition'] = exposition[row_id]
          source_path.write_text(json.dumps(rows, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # 4. Enforce the new content convention in the undergraduate renderer.
          renderer = root / 'website/scripts/undergrad_guides.py'
          text = renderer.read_text(encoding='utf-8')
          helper_anchor = "\ndef slugify(value: str) -> str:\n"
          if 'RAW_MATH_PATTERNS' not in text:
              helper = r'''

MATH_SPAN_RE = re.compile(r"\\\((?:.|\n)*?\\\)|\\\[(?:.|\n)*?\\\]", re.DOTALL)
RAW_MATH_PATTERNS: tuple[tuple[str, re.Pattern[str]], ...] = (
    ("subscripted stochastic symbol", re.compile(r"\b(?:B|F|P|X|H|A|I|eta|rho|tau|sigma|pi|Gamma)_[A-Za-z0-9{]")),
    ("plain L2/W2 notation", re.compile(r"\b(?:L2|W2)\b")),
    ("ASCII sqrt", re.compile(r"\bsqrt\s*\(")),
    ("ASCII integral", re.compile(r"\bint_[0-9A-Za-z]")),
    ("ASCII inequality", re.compile(r"(?:<=|>=)")),
    ("plain power notation", re.compile(r"\b(?:eta|rho|phi|B|c|x|f)\^[A-Za-z0-9{]")),
    ("double-bar norm notation", re.compile(r"\|\|[^|\n]+\|\|")),
    ("differential subscript notation", re.compile(r"\bd[A-Z][A-Za-z]*_t\b")),
)


def strip_math_spans(value: object) -> str:
    return MATH_SPAN_RE.sub("", str(value))


def find_unwrapped_math(value: object) -> list[str]:
    residual = strip_math_spans(value)
    return [label for label, pattern in RAW_MATH_PATTERNS if pattern.search(residual)]


def guide_strings(guide: dict[str, object]) -> list[tuple[str, str]]:
    rows: list[tuple[str, str]] = []
    for key in ("audience", "question", "promise"):
        rows.append((key, str(guide[key])))
    for index, value in enumerate(list(guide["before_you_start"]), 1):
        rows.append((f"before_you_start[{index}]", str(value)))
    for index, raw in enumerate(list(guide["story"]), 1):
        item = normalize_story(raw, index)
        for key in ("title", "intuition", "tiny_example", "remember"):
            if item[key]:
                rows.append((f"story[{index}].{key}", item[key]))
    for index, raw in enumerate(list(guide["vocabulary"]), 1):
        term, plain = normalize_vocab(raw)
        rows.append((f"vocabulary[{index}].term", term))
        rows.append((f"vocabulary[{index}].plain", plain))
    return rows
'''
              if helper_anchor not in text:
                  raise SystemExit('undergrad guide helper anchor not found')
              text = text.replace(helper_anchor, helper + helper_anchor, 1)

          old = '        guides[str(section)] = dict(candidate)\n'
          new = '''        guide = dict(candidate)
        for field, value in guide_strings(guide):
            issues = find_unwrapped_math(value)
            if issues:
                raise RuntimeError(
                    f"guide {section} {field} contains unwrapped math ({', '.join(issues)}): {value}"
                )
        guides[str(section)] = guide
'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'contains unwrapped math' not in text:
              raise SystemExit('undergrad guide validation anchor not found')
          renderer.write_text(text, encoding='utf-8')

          tests = root / 'tools/tests/test_undergrad_guides.py'
          test_text = tests.read_text(encoding='utf-8')
          test_anchor = '    def test_site_injection_is_idempotent(self) -> None:\n'
          if 'test_unwrapped_math_detection' not in test_text:
              test_method = r'''    def test_unwrapped_math_detection(self) -> None:
        self.assertTrue(undergrad_guides.find_unwrapped_math("At time B_t"))
        self.assertTrue(undergrad_guides.find_unwrapped_math("Use the L2 norm"))
        self.assertEqual(undergrad_guides.find_unwrapped_math(r"At time \(B_t\)"), [])
        self.assertEqual(undergrad_guides.find_unwrapped_math(r"Use the \(L^2\) norm"), [])

'''
              if test_anchor not in test_text:
                  raise SystemExit('undergrad guide test anchor not found')
              test_text = test_text.replace(test_anchor, test_method + test_anchor, 1)
          tests.write_text(test_text, encoding='utf-8')
          PY

      - name: Validate normalization
        run: |
          python3 -m py_compile website/scripts/undergrad_guides.py
          python3 -m unittest tools.tests.test_undergrad_guides
          python3 - <<'PY'
          import json
          from pathlib import Path
          guides = json.loads(Path('website/content/undergrad_guides.json').read_text())
          assert '\\(B_t\\)' in guides['1.1']['story'][0]['intuition']
          sources = json.loads(Path('website/content/source_correspondence.json').read_text())
          row = next(x for x in sources if x['id'] == 'chewi-1-1-display-1-1-5')
          assert row.get('latex_statement')
          PY

      - name: Commit normalized reader math and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-reader-math.yml
          git add website/content/section_guides.json \
                  website/content/undergrad_guides.json \
                  website/content/source_correspondence.json \
                  website/scripts/undergrad_guides.py \
                  tools/tests/test_undergrad_guides.py
          git commit -m "Render mathematical notation in reader summaries"
          git push origin HEAD:chapter-1-ito-process-definition
