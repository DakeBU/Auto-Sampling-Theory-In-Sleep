name: One-shot Chapter 1.1.16 evidence sync

on:
  push:
    branches:
      - chapter-1-stopped-ito-consistency
    paths:
      - .github/workflows/one-shot-1-1-16-evidence-sync.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chapter-1-stopped-ito-consistency
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize source evidence and teaching status
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          root = Path('.')
          matrix_path = root / 'website/content/chapter_1_completion_matrix.json'
          source_path = root / 'website/content/source_correspondence.json'
          registry_path = root / 'AutoSamplingTheory/TechnicalLemmas/Registry.lean'
          lessons_path = root / 'website/static/rigorous-lessons.json'
          tests_path = root / 'tools/tests/test_astis_site.py'

          matrix = json.loads(matrix_path.read_text(encoding='utf-8'))
          items = matrix['items']
          by_number = {str(item['number']): item for item in items}

          evidence = {
              '1.1.13': {
                  'source_id': 'chewi-proposition-1-1-13',
                  'declaration': 'AutoSamplingTheory.TechnicalLemmas.StochasticProcesses.CanonicalLocalizationTheorem.chewi_proposition_1_1_13',
                  'test': 'Tests/CanonicalLocalizationTheorem.lean',
                  'registry': 'localization.chewi-proposition-1-1-13',
                  'source_assumptions': [
                      'a complete right-continuous filtered probability space',
                      'a progressive integrand whose squared time integral is finite almost surely on the finite horizon',
                  ],
                  'formal_assumptions': [
                      'SatisfiesUsualConditions filtration mu',
                      'IsProbabilityMeasure mu',
                      'LocalProgressiveL2Integrand filtration mu T',
                  ],
                  'consumers': ['display (1.1.14)', 'Proposition 1.1.16'],
              },
              '1.1.14': {
                  'source_id': 'chewi-1-1-display-1-1-14',
                  'declaration': 'AutoSamplingTheory.TechnicalLemmas.StochasticProcesses.CanonicalStoppedItoIntegral.chewi_display_1_1_14',
                  'test': 'Tests/CanonicalStoppedItoIntegral.lean',
                  'registry': 'localization.chewi-display-1-1-14',
                  'source_assumptions': [
                      'the canonical localizing sequence of Proposition 1.1.13',
                      'a Brownian motion relative to the filtration',
                      'a positive finite horizon',
                  ],
                  'formal_assumptions': [
                      'SatisfiesUsualConditions filtration mu',
                      'IsProbabilityMeasure mu',
                      'LocalProgressiveL2Integrand filtration mu T',
                      '0 < T',
                      'IsBrownianMotionWithFiltration B filtration mu',
                  ],
                  'consumers': ['Proposition 1.1.16'],
              },
              '1.1.16': {
                  'source_id': 'chewi-proposition-1-1-16',
                  'declaration': 'AutoSamplingTheory.TechnicalLemmas.StochasticProcesses.ChewiProposition1_1_16.chewi_proposition_1_1_16',
                  'test': 'Tests/ChewiProposition1_1_16.lean',
                  'registry': 'localization.chewi-proposition-1-1-16',
                  'source_assumptions': [
                      'a complete right-continuous filtered probability space',
                      'a Brownian motion relative to the filtration',
                      'a progressive integrand with almost-sure locally finite squared energy',
                  ],
                  'formal_assumptions': [
                      'SatisfiesUsualConditions filtration mu',
                      'IsProbabilityMeasure mu',
                      'GlobalLocalProgressiveL2Integrand filtration mu',
                      'IsBrownianMotionWithFiltration B filtration mu',
                  ],
                  'consumers': ['Definition 1.1.17 (Ito process)', 'Ito formula and SDE localization'],
              },
          }

          for number, spec in evidence.items():
              item = by_number[number]
              item['source_correspondence_id'] = spec['source_id']
              item['required_declarations'] = [spec['declaration']]
              item['focused_tests'] = [spec['test']]
              item['registry_keys'] = [spec['registry']]
              item['coverage_status'] = 'complete'
              item['residual_blockers'] = []
              item['source_assumptions'] = spec['source_assumptions']
              item['formal_assumptions'] = spec['formal_assumptions']
              item['downstream_consumers'] = spec['consumers']

          matrix_path.write_text(json.dumps(matrix, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          correspondence = json.loads(source_path.read_text(encoding='utf-8'))
          existing = {str(row['id']): row for row in correspondence}

          exposition = {
              '1.1.13': {
                  'source_summary': 'The pathwise local-square-integrability condition admits an increasing canonical sequence of stopping times approaching the horizon such that each stopped integrand has finite global L2 energy.',
                  'mathematical_exposition': 'Complete the null exceptional set, form the continuous accumulated-energy path, stop at the first equality level n+1, and use continuity to rule out overshoot. The threshold-event characterization makes each first-hit time a stopping time; monotonicity in the level and finite terminal energy make the sequence exhaust the horizon.',
                  'astis_exposition': 'ASTIS formalizes the exceptional-set completion, equality-level first hit, intermediate-value argument, stopping-time event equivalence, exact stopped-energy identity, and eventual terminal-time property rather than treating localization as a black box.',
                  'rigorous_packet': 'The usual filtration conditions, completion of null sets, progressive measurability, pathwise energy continuity, stopping-time measurability, no-overshoot argument, and product-L2 consequence under a probability law are explicit.',
                  'semantic_status': 'source-facing canonical localization theorem compiled with stopping-time, monotonicity, horizon exhaustion, and stopped-energy bound',
                  'proof_leaves': [
                      {
                          'node_id': 'chapter1-canonical-localization',
                          'label': 'Canonical energy localization',
                          'declarations': ['chewi_proposition_1_1_13'],
                          'dependencies': ['continuous_completedEnergy', 'canonicalEnergyLocalizer_le_iff', 'canonicalLocalizingTime_isChewiStoppingTime', 'integral_energyStoppedIntegrand_sq_le'],
                          'priority': 100,
                          'route_status': 'compiled',
                      }
                  ],
              },
              '1.1.14': {
                  'source_summary': 'Each canonical energy truncation is globally square-integrable, so its Ito integral is an adapted continuous martingale with the deterministic-time restriction representation used in the localization proof.',
                  'mathematical_exposition': 'Proposition 1.1.13 turns the locally square-integrable integrand into a globally L2 stopped integrand. Applying the already constructed global Ito map gives a continuous martingale M^(n), and for each deterministic t its value agrees almost surely with the terminal completed Ito integral of the same stopped integrand restricted to the interval up to t.',
                  'astis_exposition': 'ASTIS deliberately reuses the global Ito integral from Theorem 1.1.8 and proves adaptedness, martingality, continuity, and deterministic-time restriction compatibility in one source-facing display theorem. Arbitrary random-time stopping is kept as a separate bridge and is discharged in Proposition 1.1.16.',
                  'rigorous_packet': 'The stopped integrand global-L2 bound, Brownian/filtration contract, positive construction horizon, process-level continuous version, and distinction between deterministic-time restriction and random stopping are explicit.',
                  'semantic_status': 'source-facing stopped-Ito display compiled as a continuous martingale with deterministic-time restriction compatibility',
                  'proof_leaves': [
                      {
                          'node_id': 'chapter1-stopped-global-ito',
                          'label': 'Energy-truncated global Ito martingale',
                          'declarations': ['chewi_display_1_1_14'],
                          'dependencies': ['chewi_proposition_1_1_13', 'canonicalStoppedProgressiveL2', 'itoIntegralProcess_martingale', 'itoIntegralProcess_continuous_ae'],
                          'priority': 100,
                          'route_status': 'compiled',
                      }
                  ],
              },
              '1.1.16': {
                  'source_summary': 'The Ito integral of a progressive locally square-integrable integrand has a continuous version that is a local martingale.',
                  'mathematical_exposition': 'Use the canonical energy localizers to obtain globally L2 stopped integrands. Prove that stochastic integration commutes with those random stops by first handling grid-valued stops and then passing through dyadic approximation in L2 and along continuous paths. Prove cross-horizon consistency, glue the finite-horizon processes pathwise, and use localizers increasing to infinity almost surely to obtain the global continuous local martingale.',
                  'astis_exposition': 'ASTIS compiles the random-stopping coefficient identity, full elementary-Ito finite-sum stopping identity, right-dyadic stopping limit, stopped-integrand L2 contraction, stopping-graph null set, cross-horizon overlap, localized martingale coherence, and final pathwise gluing into the exact source-facing proposition.',
                  'rigorous_packet': 'The strict-versus-closed stopping boundary is isolated to a product-measure-zero stopping graph; finite-horizon Ito versions are proved compatible before gluing; and the localizing sequence is proved monotone and tending to infinity almost surely.',
                  'semantic_status': 'source-facing local-Ito continuous-local-martingale theorem compiled with random-stopping and cross-horizon gluing',
                  'proof_leaves': [
                      {
                          'node_id': 'chapter1-random-stopping-ito',
                          'label': 'Random stopping and L2 passage',
                          'declarations': ['chewi_proposition_1_1_16_stopped_integral_representation'],
                          'dependencies': ['elementaryItoIntegral_stop_gridValued', 'tendsto_rightApproxTime_stoppingValue', 'tendsto_stop_toLp_of_tendsto', 'processTimeMeasure_stoppingGraph_zero'],
                          'priority': 100,
                          'route_status': 'compiled',
                      },
                      {
                          'node_id': 'chapter1-global-ito-gluing',
                          'label': 'Cross-horizon pathwise gluing and localization',
                          'declarations': ['chewi_proposition_1_1_16', 'chewi_proposition_1_1_16_localizers'],
                          'dependencies': ['stop_globalStopped_toLp_eq_extendByZero', 'globalStoppedItoProcess_overlap_pathwise_ae', 'globalItoProcess_isLocalMartingale'],
                          'priority': 100,
                          'route_status': 'compiled',
                      },
                  ],
              },
          }

          for number, spec in evidence.items():
              item = by_number[number]
              details = exposition[number]
              row = {
                  'id': spec['source_id'],
                  'chapter': 1,
                  'section': '1.1',
                  'edition': matrix['edition'],
                  'book_page': item['book_page'],
                  'pdf_page': item['pdf_page'],
                  'page': f"book {item['book_page']} / PDF {item['pdf_page']}",
                  'source_kind': item['source_kind'],
                  'source_url': f"{matrix['canonical_url']}#page={item['pdf_page']}",
                  'wording_status': 'faithful paraphrase',
                  'source_summary': details['source_summary'],
                  'mathematical_exposition': details['mathematical_exposition'],
                  'astis_exposition': details['astis_exposition'],
                  'rigorous_packet': details['rigorous_packet'],
                  'lean_declarations': [spec['declaration']],
                  'source_assumptions': spec['source_assumptions'],
                  'formal_assumptions': spec['formal_assumptions'],
                  'downstream_consumers': spec['consumers'],
                  'status': 'compiled',
                  'route_status': 'compiled',
                  'local_status': 'compiled',
                  'semantic_status': details['semantic_status'],
                  'remaining_obligations': [],
                  'proof_leaves': details['proof_leaves'],
                  'source_mapping_id': item['source_route_id'],
              }
              if row['id'] in existing:
                  existing[row['id']].clear()
                  existing[row['id']].update(row)
              else:
                  correspondence.append(row)
                  existing[row['id']] = row

          source_path.write_text(json.dumps(correspondence, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          registry = registry_path.read_text(encoding='utf-8')
          old_note = 'The stopped-integral identity (display 1.1.14) and the continuous local-martingale theorem (Proposition 1.1.16) remain separate downstream routes.'
          new_note = 'Display (1.1.14) and Proposition 1.1.16 remain separate theorem routes; both are now compiled, so this entry records only the canonical localization component.'
          if old_note in registry:
              registry = registry.replace(old_note, new_note, 1)

          marker = '  {\n    key := "localization.completed-integrand-progressive",'
          if marker not in registry:
              raise SystemExit('Registry insertion marker not found')

          additions = '''  {
            key := "localization.chewi-display-1-1-14",
            localDecl := "AutoSamplingTheory.TechnicalLemmas.StochasticProcesses.CanonicalStoppedItoIntegral.chewi_display_1_1_14",
            upstreamDecl := "Chewi display (1.1.14)",
            upstreamFile := "Log-Concave Sampling, book page 7 / PDF page 19",
            status := LemmaMemoryStatus.formalizedLocal,
            tags := ["Chewi", "Ito", "localization", "stopped-integral", "continuous-martingale"],
            saldUse := "package each canonical energy truncation as a globally L2 Ito integrand whose Ito process is adapted, continuous, martingale, and compatible with deterministic-time restriction",
            note := "This compiles the intermediate stopped-global-Ito display. Arbitrary random-stopping consistency and cross-horizon gluing are discharged separately by Proposition 1.1.16."
          },
          {
            key := "localization.chewi-proposition-1-1-16",
            localDecl := "AutoSamplingTheory.TechnicalLemmas.StochasticProcesses.ChewiProposition1_1_16.chewi_proposition_1_1_16",
            upstreamDecl := "Chewi Proposition 1.1.16",
            upstreamFile := "Log-Concave Sampling, book page 7 / PDF page 19",
            status := LemmaMemoryStatus.formalizedLocal,
            tags := ["Chewi", "Ito", "local-martingale", "localization", "random-stopping", "continuous-paths"],
            saldUse := "package random-stopping consistency, cross-horizon overlap, localized martingale coherence, and pathwise gluing into the source local-Ito continuous-local-martingale result",
            note := "Uses the canonical localizers from Proposition 1.1.13; stopped-integral compatibility, stopping-graph nullity, and cross-horizon gluing are all compiled."
          },
          '''
          if 'key := "localization.chewi-display-1-1-14"' not in registry:
              registry = registry.replace(marker, additions + marker, 1)
          if 'key := "localization.chewi-proposition-1-1-16"' not in registry:
              # Both entries are inserted together above; this catches an inconsistent prior partial migration.
              raise SystemExit('Registry 1.1.16 entry missing after insertion')
          registry_path.write_text(registry, encoding='utf-8')

          lessons = json.loads(lessons_path.read_text(encoding='utf-8'))
          lesson_by_id = {str(entry['id']): entry for entry in lessons['entries']}
          lesson13 = lesson_by_id['chewi-1-1-13-rigorous-localization']
          lesson14 = lesson_by_id['chewi-1-1-14-stopped-global-ito']
          lesson13['scope_note'] = (
              "This is an ASTIS rigorous expansion of Chewi's localization argument. It proves the localization component itself; "
              "Proposition 1.1.16 additionally needs random-stopping consistency and cross-horizon gluing, which are now compiled in a separate source-facing route."
          )
          lesson14['scope_note'] = (
              'This display applies the already-constructed global L2 Ito integral to the canonical energy truncation. '
              'The display itself gives deterministic-time restriction compatibility, not arbitrary random-stopping consistency; '
              'that extra bridge belongs to Proposition 1.1.16 and is now compiled separately.'
          )
          lesson14['subtle_points'][-1] = (
              'The required grid-valued stopping, dyadic approximation, L2/continuous-path passage, stopping-graph nullity, '
              'cross-horizon overlap, and pathwise gluing steps are now compiled and assembled in Proposition 1.1.16.'
          )
          lessons_path.write_text(json.dumps(lessons, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          tests = tests_path.read_text(encoding='utf-8')
          old_test = '''    def test_localization_lesson_preserves_open_1_1_16_boundary(self) -> None:
              data = json.loads(RIGOROUS_LESSONS.read_text(encoding="utf-8"))
              text = json.dumps(data, ensure_ascii=False)
              self.assertIn("does not by itself close Proposition 1.1.16", text)
              self.assertIn("does not yet prove that stochastic integration commutes", text)
              self.assertIn("grid-valued stopping", text)
          '''
          new_test = '''    def test_localization_lesson_explains_closed_1_1_16_bridge(self) -> None:
              data = json.loads(RIGOROUS_LESSONS.read_text(encoding="utf-8"))
              text = json.dumps(data, ensure_ascii=False)
              self.assertIn("Proposition 1.1.16 additionally needs random-stopping consistency", text)
              self.assertIn("is now compiled separately", text)
              self.assertIn("grid-valued stopping", text)
              self.assertIn("stopping-graph nullity", text)
              self.assertIn("assembled in Proposition 1.1.16", text)
              self.assertNotIn("keeps Proposition 1.1.16 partial", text)
          '''
          if old_test not in tests:
              raise SystemExit('stale rigorous-lesson test block not found')
          tests = tests.replace(old_test, new_test, 1)
          tests_path.write_text(tests, encoding='utf-8')

          print('Promoted source evidence for 1.1.13, 1.1.14, and 1.1.16.')
          PY
      - name: Validate migration payload
        shell: bash
        run: |
          python3 -m json.tool website/content/chapter_1_completion_matrix.json >/dev/null
          python3 -m json.tool website/content/source_correspondence.json >/dev/null
          python3 -m json.tool website/static/rigorous-lessons.json >/dev/null
          python3 -m py_compile tools/tests/test_astis_site.py
          grep -q 'localization.chewi-proposition-1-1-16' AutoSamplingTheory/TechnicalLemmas/Registry.lean
          grep -q 'localization.chewi-display-1-1-14' AutoSamplingTheory/TechnicalLemmas/Registry.lean
      - name: Commit synchronized evidence and remove migration workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-1-1-16-evidence-sync.yml
          git add \
            AutoSamplingTheory/TechnicalLemmas/Registry.lean \
            website/content/chapter_1_completion_matrix.json \
            website/content/source_correspondence.json \
            website/static/rigorous-lessons.json \
            tools/tests/test_astis_site.py
          git commit -m 'Sync Chapter 1.1.13-1.1.16 source evidence'
          git push origin HEAD:chapter-1-stopped-ito-consistency
