name: Close Chewi Proposition 1.1.13 evidence once

on:
  push:
    branches:
      - chapter-1-langevin-diffusion-completion
    paths:
      - tools/close_chewi_proposition_1_1_13.py
      - .github/workflows/close-chewi-proposition-1-1-13-once.yml

permissions:
  contents: write

concurrency:
  group: close-chewi-proposition-1-1-13-once
  cancel-in-progress: false

jobs:
  close:
    if: >-
      github.repository == 'DakeBU/Auto-Sampling-Theory-In-Sleep' &&
      github.ref_name == 'chapter-1-langevin-diffusion-completion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chapter-1-langevin-diffusion-completion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch source correspondence, matrix, and teaching evidence
        run: |
          python3 tools/close_chewi_proposition_1_1_13.py
          python3 tools/astis.py chewi-source-check
          python3 tools/astis.py chapter-1-check
          python3 website/scripts/build_site.py
          python3 website/scripts/check_site.py
      - name: Commit deterministic evidence closure and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Dake Bu"
          git config user.email "159223240+DakeBU@users.noreply.github.com"
          git rm tools/close_chewi_proposition_1_1_13.py
          git rm .github/workflows/close-chewi-proposition-1-1-13-once.yml
          git add website/content/source_correspondence.json website/content/chapter_1_completion_matrix.json website/content/teaching_declarations.json
          git diff --cached --check
          git commit -m "Close Chewi Proposition 1.1.13"
          git push origin HEAD:chapter-1-langevin-diffusion-completion
