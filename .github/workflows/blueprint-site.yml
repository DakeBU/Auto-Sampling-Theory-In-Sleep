name: Blueprint textbook site

on:
  push:
    branches: [main]
    paths:
      - "AutoSamplingTheory/**"
      - "Tests/**"
      - "website/**"
      - "tools/astis.py"
      - "tools/astis_site.py"
      - ".github/workflows/blueprint-site.yml"
  pull_request:
    paths:
      - "AutoSamplingTheory/**"
      - "Tests/**"
      - "website/**"
      - "tools/astis.py"
      - "tools/astis_site.py"
      - ".github/workflows/blueprint-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: blueprint-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Registry-driven site
        run: python3 tools/astis.py site-build

      - name: Validate declarations, status, and links
        run: python3 tools/astis.py site-check

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

