<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">From AI proof text to verified graph contribution</title>
  <desc id="desc">Plain AI proof generation produces fluent proof text without a Lean certificate or reusable formal interface. ASTIS turns source-backed reasoning into checked Lean declarations and places them in the Underlying Lean Graph, where new work can be understood as a leaf, bridge, shortcut, reusable hub, or structural reorganization.</desc>
  <defs>
    <style>
      .bg{fill:#f7f9fc}.panel{fill:#fff;stroke:#d6dee9;stroke-width:2}.bad{fill:#fff4f2;stroke:#d92d20;stroke-width:2}.good{fill:#ecfdf3;stroke:#087443;stroke-width:2}.lean{fill:#eef4ff;stroke:#155eef;stroke-width:2}.graph{fill:#f4ebff;stroke:#7f56d9;stroke-width:2}.title{fill:#172033;font:700 25px Inter,Arial,sans-serif}.panel-title{fill:#172033;font:700 18px Inter,Arial,sans-serif}.node-title{fill:#172033;font:700 15px Inter,Arial,sans-serif}.copy{fill:#52657a;font:13px Inter,Arial,sans-serif}.small{fill:#667085;font:12px Inter,Arial,sans-serif}.arrow{fill:none;stroke:#718096;stroke-width:2;marker-end:url(#arrow)}.edge{stroke:#7f56d9;stroke-width:3;fill:none}.node{fill:#fff;stroke:#7f56d9;stroke-width:2}.newnode{fill:#dcfae6;stroke:#087443;stroke-width:2.5}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#718096"/></marker>
  </defs>

  <rect class="bg" width="1400" height="560" rx="12"/>
  <text class="title" x="700" y="38" text-anchor="middle">Why a verified formal graph changes the research object</text>

  <rect class="panel" x="30" y="70" width="400" height="458" rx="12"/>
  <text class="panel-title" x="230" y="105" text-anchor="middle">Plain AI proof generation</text>
  <rect class="bad" x="85" y="142" width="290" height="70" rx="9"/>
  <text class="node-title" x="230" y="171" text-anchor="middle">Paper / problem → fluent proof prose</text>
  <text class="copy" x="230" y="194" text-anchor="middle">useful ideas, but no mechanical certificate</text>
  <path class="arrow" d="M230 212V246"/>
  <rect class="bad" x="85" y="246" width="290" height="180" rx="9"/>
  <text class="node-title" x="230" y="278" text-anchor="middle">What remains uncertain</text>
  <text class="copy" x="230" y="309" text-anchor="middle">hidden assumptions</text>
  <text class="copy" x="230" y="336" text-anchor="middle">type / boundary mismatches</text>
  <text class="copy" x="230" y="363" text-anchor="middle">statement drift</text>
  <text class="copy" x="230" y="390" text-anchor="middle">no callable verified interface</text>
  <text class="small" x="230" y="414" text-anchor="middle">the next proof may rediscover the same idea from scratch</text>
  <text class="small" x="230" y="476" text-anchor="middle">Result = isolated proof text</text>

  <rect class="panel" x="455" y="70" width="400" height="458" rx="12"/>
  <text class="panel-title" x="655" y="105" text-anchor="middle">ASTIS</text>
  <rect class="good" x="510" y="138" width="290" height="62" rx="9"/>
  <text class="node-title" x="655" y="165" text-anchor="middle">Source-backed mathematical advance</text>
  <text class="copy" x="655" y="186" text-anchor="middle">exact theorem delta + truth boundary</text>
  <path class="arrow" d="M655 200V230"/>
  <rect class="lean" x="510" y="230" width="290" height="76" rx="9"/>
  <text class="node-title" x="655" y="258" text-anchor="middle">Lean-checked declaration</text>
  <text class="copy" x="655" y="281" text-anchor="middle">exact hypotheses · types · proof term</text>
  <path class="arrow" d="M655 306V336"/>
  <rect class="graph" x="510" y="336" width="290" height="100" rx="9"/>
  <text class="node-title" x="655" y="365" text-anchor="middle">Reusable formal memory</text>
  <text class="copy" x="655" y="389" text-anchor="middle">named parents + consumers</text>
  <text class="copy" x="655" y="412" text-anchor="middle">retrievable by later human / AI proofs</text>
  <text class="small" x="655" y="476" text-anchor="middle">Result = checked node or connection in the field graph</text>

  <rect class="panel" x="880" y="70" width="490" height="458" rx="12"/>
  <text class="panel-title" x="1125" y="105" text-anchor="middle">How to read a new mathematical contribution</text>
  <text class="small" x="1125" y="130" text-anchor="middle">not only “is the theorem new?” — ask what topology it adds</text>

  <text class="node-title" x="955" y="177">Leaf</text>
  <path class="edge" d="M1040 172H1100"/><circle class="node" cx="1040" cy="172" r="11"/><circle class="newnode" cx="1112" cy="172" r="13"/>
  <text class="small" x="1160" y="177">one more terminal consequence</text>

  <text class="node-title" x="955" y="242">Bridge</text>
  <circle class="node" cx="1040" cy="232" r="11"/><circle class="node" cx="1110" cy="252" r="11"/><circle class="node" cx="1180" cy="232" r="11"/>
  <path class="edge" d="M1051 235L1099 249M1121 249L1169 235"/><circle class="newnode" cx="1110" cy="252" r="13"/>
  <text class="small" x="1220" y="246">joins previously separate branches</text>

  <text class="node-title" x="955" y="318">Shortcut</text>
  <circle class="node" cx="1040" cy="307" r="10"/><circle class="node" cx="1100" cy="307" r="10"/><circle class="node" cx="1160" cy="307" r="10"/>
  <path class="edge" d="M1050 307H1090M1110 307H1150"/><path d="M1045 292Q1100 258 1155 292" stroke="#087443" stroke-width="3" fill="none"/>
  <text class="small" x="1220" y="312">shortens an important proof route</text>

  <text class="node-title" x="955" y="394">Reusable hub</text>
  <circle class="newnode" cx="1110" cy="385" r="15"/><circle class="node" cx="1045" cy="360" r="9"/><circle class="node" cx="1045" cy="410" r="9"/><circle class="node" cx="1175" cy="360" r="9"/><circle class="node" cx="1175" cy="410" r="9"/>
  <path class="edge" d="M1054 363L1095 380M1054 407L1095 390M1125 380L1166 363M1125 390L1166 407"/>
  <text class="small" x="1220" y="390">new interface reused by many results</text>

  <text class="node-title" x="955" y="470">Reorganization</text>
  <text class="small" x="1070" y="470">changes the structural spine of the graph</text>
  <path d="M1030 491H1205" stroke="#7f56d9" stroke-width="2"/>
  <circle class="node" cx="1050" cy="491" r="8"/><circle class="newnode" cx="1110" cy="491" r="11"/><circle class="node" cx="1170" cy="491" r="8"/>
</svg>
