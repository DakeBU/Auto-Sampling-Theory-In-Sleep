name: OT functor isolated workspace
on:
  push:
    branches: [work/ot-functor-20260905]
    paths: [.github/workflows/ot-functor-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bundle tracked source for offline validation
        run: git archive --format=tar.gz HEAD -o /tmp/astis-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: astis-source-workspace
          path: /tmp/astis-source.tar.gz
          retention-days: 1
