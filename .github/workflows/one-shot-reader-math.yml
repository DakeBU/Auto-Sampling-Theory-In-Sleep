name: One-shot reader math normalization

on:
  push:
    branches: [chapter-1-ito-process-definition]
    paths:
      - ".github/workflows/one-shot-reader-math.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chapter-1-ito-process-definition
          fetch-depth: 0

      - name: Normalize reader-facing mathematical notation
        run: python3 tools/one_shot_reader_math.py

      - name: Validate normalization
        run: |
          python3 -m py_compile website/scripts/undergrad_guides.py
          python3 -m unittest tools.tests.test_undergrad_guides
          python3 - <<'PY'
          import json
          from pathlib import Path
          guides = json.loads(Path('website/content/undergrad_guides.json').read_text())
          assert '\\(B_t\\)' in guides['1.1']['story'][0]['intuition']
          sources = json.loads(Path('website/content/source_correspondence.json').read_text())
          row = next(x for x in sources if x['id'] == 'chewi-1-1-display-1-1-5')
          assert row.get('latex_statement')
          PY

      - name: Commit normalized reader math and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-reader-math.yml tools/one_shot_reader_math.py
          git add website/content/section_guides.json \
                  website/content/undergrad_guides.json \
                  website/content/source_correspondence.json \
                  website/scripts/undergrad_guides.py \
                  tools/tests/test_undergrad_guides.py
          git commit -m "Render mathematical notation in reader summaries"
          git push origin HEAD:chapter-1-ito-process-definition
