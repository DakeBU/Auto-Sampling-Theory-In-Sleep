  <text class="title" x="700" y="35" text-anchor="middle">Samplinglib: verified memory for sampling theory</text>

  <rect class="source" x="430" y="58" width="540" height="72" rx="7"/>
  <text class="source-text" x="700" y="87" text-anchor="middle">Textbooks &#183; papers &#183; research problems</text>
  <text class="source-text" x="700" y="112" text-anchor="middle">LaTeX and mathematical prose</text>
  <path class="arrow" d="M700 130 V165"/>

  <rect class="band" x="32" y="166" width="1336" height="218" rx="8"/>
