name: One-shot rigorous lesson test fixer

on:
  push:
    branches:
      - chapter-1-stopped-ito-consistency
    paths:
      - .github/workflows/one-shot-fix-rigorous-test.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chapter-1-stopped-ito-consistency
          fetch-depth: 0
      - name: Replace stale lesson-status test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/tests/test_astis_site.py')
          text = path.read_text(encoding='utf-8')
          start_token = '    def test_localization_lesson_preserves_open_1_1_16_boundary(self) -> None:'
          if start_token in text:
              start = text.index(start_token)
              end = text.index('\n\nif __name__ == "__main__":', start)
              lines = [
                  '    def test_localization_lesson_explains_closed_1_1_16_bridge(self) -> None:',
                  '        data = json.loads(RIGOROUS_LESSONS.read_text(encoding="utf-8"))',
                  '        text = json.dumps(data, ensure_ascii=False)',
                  '        self.assertIn("Proposition 1.1.16 additionally needs random-stopping consistency", text)',
                  '        self.assertIn("is now compiled separately", text)',
                  '        self.assertIn("grid-valued stopping", text)',
                  '        self.assertIn("stopping-graph nullity", text)',
                  '        self.assertIn("assembled in Proposition 1.1.16", text)',
                  '        self.assertNotIn("keeps Proposition 1.1.16 partial", text)',
              ]
              text = text[:start] + '\n'.join(lines) + text[end:]
          elif 'def test_localization_lesson_explains_closed_1_1_16_bridge' not in text:
              raise SystemExit('target test function not found')
          path.write_text(text, encoding='utf-8')
          PY
          python3 -m py_compile tools/tests/test_astis_site.py
      - name: Commit fix and remove helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-fix-rigorous-test.yml
          git add tools/tests/test_astis_site.py
          git commit -m 'Update lesson test for compiled Proposition 1.1.16'
          git push origin HEAD:chapter-1-stopped-ito-consistency
