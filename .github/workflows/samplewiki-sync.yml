name: SampleWiki source watch

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/samplewiki-sync.yml"
      - "tools/samplewiki_sync.py"
      - "tools/samplewiki_cases.py"
      - "research-wiki/source-index/SampleWiki.md"
      - "research-wiki/source-index/SampleWiki_manifest.json"
      - "research-wiki/source-index/SampleWiki_cases.json"
      - "website/content/samplewiki_example_cases.json"
      - "website/scripts/samplewiki_examples.py"
      - "website/scripts/build_site.py"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: samplewiki-source-watch
  cancel-in-progress: false

jobs:
  source-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile source tools
        run: python3 -m py_compile tools/samplewiki_sync.py tools/samplewiki_cases.py
      - name: Probe live source into ephemeral manifests
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .astis

          retry() {
            local attempt=1
            local max_attempts=4
            local delay=2
            until "$@"; do
              if (( attempt >= max_attempts )); then
                echo "::error::SampleWiki probe failed after ${max_attempts} attempts: $*"
                return 1
              fi
              echo "::warning::SampleWiki probe attempt ${attempt}/${max_attempts} failed; retrying in ${delay}s: $*"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          retry python3 tools/samplewiki_sync.py \
            --write \
            --output .astis/SampleWiki_probe_manifest.json \
            --max-pages 50 \
            --delay 0.02
          retry python3 tools/samplewiki_cases.py \
            --write \
            --output .astis/SampleWiki_cases_probe.json
      - name: Print bounded source and case catalogs
        if: steps.probe.outcome == 'success'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = json.loads(Path('.astis/SampleWiki_probe_manifest.json').read_text(encoding='utf-8'))
          cases = json.loads(Path('.astis/SampleWiki_cases_probe.json').read_text(encoding='utf-8'))
          print('=== SampleWiki bounded page catalog ===')
          for index, page in enumerate(source.get('pages', []), 1):
              headings = ' | '.join(
                  f"{item.get('level', '')}:{item.get('text', '')}"
                  for item in page.get('headings', [])[:12]
              )
              print(
                  f"PAGE {index:03d} url={page.get('url', '')} "
                  f"title={page.get('title', '')!r} headings={headings!r}"
              )
          print('=== SampleWiki row-level case candidates ===')
          for case in cases.get('cases', []):
              print(
                  f"CASE {case.get('id')} "
                  f"class={case.get('result_class')!r} "
                  f"model={case.get('algorithm_or_model')!r} "
                  f"review={case.get('review_state')!r} "
                  f"row={str(case.get('row_sha256', ''))[:12]}"
              )
          PY
      - name: Upload source probe manifests
        if: steps.probe.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: samplewiki-probe-${{ github.run_id }}
          path: |
            .astis/SampleWiki_probe_manifest.json
            .astis/SampleWiki_cases_probe.json
          if-no-files-found: error
          retention-days: 7

  sync:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh deterministic source manifests
        shell: bash
        run: |
          set -euo pipefail

          retry() {
            local attempt=1
            local max_attempts=4
            local delay=2
            until "$@"; do
              if (( attempt >= max_attempts )); then
                echo "::error::SampleWiki sync failed after ${max_attempts} attempts: $*"
                return 1
              fi
              echo "::warning::SampleWiki sync attempt ${attempt}/${max_attempts} failed; retrying in ${delay}s: $*"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          retry python3 tools/samplewiki_sync.py --write
          retry python3 tools/samplewiki_cases.py --write

      - name: Detect source changes
        id: diff
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- \
            research-wiki/source-index/SampleWiki_manifest.json \
            research-wiki/source-index/SampleWiki_cases.json)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish source-update branch
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="automation/samplewiki-sync"
          git config user.name "astis-source-watcher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add \
            research-wiki/source-index/SampleWiki_manifest.json \
            research-wiki/source-index/SampleWiki_cases.json
          git commit -m "chore(samplewiki): refresh live source fingerprints"
          git push --force origin "HEAD:$BRANCH"

      - name: Open or refresh source-update PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="automation/samplewiki-sync"
          PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$BRANCH" --json number --jq '.[0].number // empty')"
          BODY=$(cat <<'EOF'
          Automated SampleWiki source-fingerprint and row-level case refresh.

          This PR is **provenance evidence, not a mathematical verification claim**.
          Triage the manifest diff into navigation/prose changes versus statement,
          hypothesis, guarantee, complexity, proof/source, new-case, or removed-case
          changes. Any affected mathematical case must pass ASTIS source review again
          before its `sourceReviewed` / `assimilated` status is restored.

          `SampleWiki_cases.json` treats one comparison-table result row as one
          source-pinned case candidate. Long explanatory source prose is represented
          by fingerprints and must be rewritten as an original ASTIS source card.

          Transient upstream failures are retried finitely. If all attempts fail, the
          workflow fails without replacing the last committed snapshot with a partial
          crawl.
          EOF
          )
          if [[ -z "$PR_NUMBER" ]]; then
            if ! gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$BRANCH" \
              --title "chore(samplewiki): refresh live source fingerprints" \
              --body "$BODY"; then
              echo "::warning::The repository token pushed the source branch but could not create a PR. Check the repository setting that allows GitHub Actions to create pull requests."
            fi
          else
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          fi
