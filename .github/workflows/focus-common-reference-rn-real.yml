name: ASTIS focused real common-reference RN

on:
  pull_request:
    paths:
      - "AutoSamplingTheory/TechnicalLemmas/InformationTheory/CommonReferenceRNRealDensity.lean"
      - "Tests/CommonReferenceRNRealDensity.lean"
      - ".github/workflows/focus-common-reference-rn-real.yml"

permissions:
  contents: read

jobs:
  focused-real-rn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
      - run: lake build AutoSamplingTheory.TechnicalLemmas.InformationTheory.CommonReferenceRNRealDensity
      - run: lake build Tests.CommonReferenceRNRealDensity
