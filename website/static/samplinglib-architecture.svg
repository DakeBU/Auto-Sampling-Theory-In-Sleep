  <text class="node-copy" x="700" y="630" text-anchor="middle">source correspondence &#183; exact gate digest</text>
  <path class="arrow" d="M700 644 V705"/>

  <rect class="band" x="32" y="706" width="1336" height="162" rx="8"/>
  <text class="band-title" x="58" y="734">LEARNING AND VERIFICATION SURFACES</text>

  <rect class="surface" x="58" y="753" width="292" height="86" rx="7"/>
  <text class="node-title" x="204" y="785" text-anchor="middle">Calculation Route</text>
  <text class="node-copy" x="204" y="813" text-anchor="middle">textbook proof strategy</text>

  <rect class="surface" x="388" y="753" width="292" height="86" rx="7"/>
  <text class="node-title" x="534" y="785" text-anchor="middle">Rigorous Details</text>
  <text class="node-copy" x="534" y="813" text-anchor="middle">measurability &#183; domains &#183; limits</text>

  <rect class="surface" x="718" y="753" width="292" height="86" rx="7"/>
  <text class="node-title" x="864" y="785" text-anchor="middle">Lean Foundations</text>
  <text class="node-copy" x="864" y="813" text-anchor="middle">statements &#183; dependencies &#183; source</text>

  <rect class="surface" x="1048" y="753" width="292" height="86" rx="7"/>
  <text class="node-title" x="1194" y="785" text-anchor="middle">Live Formalization</text>
  <text class="node-copy" x="1194" y="813" text-anchor="middle">candidate &#183; compile &#183; packet export</text>

  <path class="feedback" d="M1340 796 C1380 796 1380 285 1340 285"/>
  <text class="feedback-label" x="1325" y="690" text-anchor="end">unresolved leaf feedback</text>
