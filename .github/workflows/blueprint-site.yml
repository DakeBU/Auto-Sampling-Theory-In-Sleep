name: Samplinglib site

on:
  push:
    branches: [main]
    paths:
      - "AutoSamplingTheory/**"
      - "AutoSamplingTheory.lean"
      - "Tests/**"
      - "Tests.lean"
      - "website/**"
      - "lakefile.lean"
      - "lean-toolchain"
      - "lake-manifest.json"
      - "tools/astis.py"
      - "tools/astis_harness.py"
      - "tools/astis_formalizer.py"
      - "tools/astis_site.py"
      - "tools/astis_source.py"
      - "README.md"
      - ".github/workflows/blueprint-site.yml"
  pull_request:
    paths:
      - "AutoSamplingTheory/**"
      - "AutoSamplingTheory.lean"
      - "Tests/**"
      - "Tests.lean"
      - "website/**"
      - "lakefile.lean"
      - "lean-toolchain"
      - "lake-manifest.json"
      - "tools/astis.py"
      - "tools/astis_harness.py"
      - "tools/astis_formalizer.py"
      - "tools/astis_site.py"
      - "tools/astis_source.py"
      - "README.md"
      - ".github/workflows/blueprint-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  ASTIS_PUBLIC_SOURCE_LINKS: "1"

concurrency:
  group: blueprint-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Lean and Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true

      - name: Compile generator and preview tools
        run: |
          python3 -m py_compile \
            tools/astis_site.py \
            tools/astis_source.py \
            tools/astis_harness.py \
            tools/astis_formalizer.py \
            website/scripts/build_site.py \
            website/scripts/check_site.py \
            website/scripts/build_sites_bundle.py \
            website/scripts/lean_gate.py \
            website/scripts/ide_server.py \
            website/scripts/serve_preview.py \
            website/scripts/quick_tunnel.py

      - name: Test formalization and harness contracts
        run: |
          python3 -m unittest \
            tools.tests.test_astis_formalizer \
            tools.tests.test_astis_site \
            tools.tests.test_astis_source \
            tools.tests.test_astis_ide_server
          python3 tools/astis.py harness-test
          node --check website/static/site.js
          node --check website/static/ide.js

      - name: Validate canonical Chewi source edition
        run: python3 tools/astis.py chewi-source-check

      - name: Run Lean, Tests, and ASTIS consistency gate
        run: python3 website/scripts/lean_gate.py

      - name: Build source-derived site
        run: python3 website/scripts/build_site.py

      - name: Validate inventory, status, links, formulas, diagrams, and assets
        run: python3 website/scripts/check_site.py

      - name: Certify complete Chewi Chapter 1 coverage
        run: python3 website/scripts/check_site.py --require-chapter-1-closure

      - name: Build deployable static worker bundle
        run: |
          python3 website/scripts/build_sites_bundle.py
          node --input-type=module --check < .open-next/worker.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
