<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Samplinglib architecture</title>
  <desc id="desc">Mathematical sources flow through the four ASTIS layers into reusable Samplinglib formal memory and four learning and verification surfaces.</desc>
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .band { fill: #ffffff; stroke: #d6dee9; stroke-width: 2; }
      .source { fill: #172033; stroke: #172033; stroke-width: 2; }
      .upper { fill: #ece6ff; stroke: #6938ef; stroke-width: 2; }
      .middle { fill: #dcecff; stroke: #155eef; stroke-width: 2; }
      .lower { fill: #dcfae6; stroke: #087443; stroke-width: 2; }
      .review { fill: #fff2c7; stroke: #9a6700; stroke-width: 2; }
      .family { fill: #ffffff; stroke: #8ba0bb; stroke-width: 1.7; }
      .registry { fill: #dcecff; stroke: #155eef; stroke-width: 2.2; }
      .surface { fill: #ffffff; stroke: #155eef; stroke-width: 1.8; }
      .title { fill: #172033; font: 700 22px Inter, Arial, sans-serif; }
      .band-title { fill: #52657a; font: 700 15px Inter, Arial, sans-serif; letter-spacing: 1px; }
      .node-title { fill: #172033; font: 700 17px Inter, Arial, sans-serif; }
      .node-copy { fill: #52657a; font: 14px Inter, Arial, sans-serif; }
      .artifact { fill: #172033; font: 13px 'DejaVu Sans Mono', monospace; }
      .source-text { fill: #ffffff; font: 600 17px Inter, Arial, sans-serif; }
      .arrow { fill: none; stroke: #718096; stroke-width: 2; marker-end: url(#arrow); }
      .feedback { fill: none; stroke: #c92a2a; stroke-width: 1.8; stroke-dasharray: 7 6; marker-end: url(#red-arrow); }
      .feedback-label { fill: #a32626; font: 600 12px Inter, Arial, sans-serif; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/>
    </marker>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c92a2a"/>
    </marker>
  </defs>

