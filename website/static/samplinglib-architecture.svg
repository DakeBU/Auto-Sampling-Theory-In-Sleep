  <text class="node-title" x="204" y="245" text-anchor="middle">UPPER</text>
  <text class="node-copy" x="204" y="272" text-anchor="middle">source audit &#183; assumptions</text>
  <text class="node-copy" x="204" y="294" text-anchor="middle">proof DAG &#183; process memory</text>
  <text class="artifact" x="204" y="326" text-anchor="middle">analytic_contract</text>

